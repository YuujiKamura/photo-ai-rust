[package]
name = "photo-ai-common"
version = "0.2.0"
edition = "2021"
description = "Photo AI common library: types, export, hierarchy"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
thiserror = "2"
rust_xlsxwriter = { version = "0.92", optional = true }
pdf-analysis-embed = { path = "../deps/pdf-analysis-embed" }

[dev-dependencies]
tempfile = "3"

[features]
default = []
excel = ["rust_xlsxwriter"]
pdf = []
wasm = []
