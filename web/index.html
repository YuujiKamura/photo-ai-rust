<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>photo-ai</title>
<style>
:root {
  --bg: #0f0f0f;
  --sidebar-bg: #171717;
  --surface: #1e1e1e;
  --border: #2e2e2e;
  --text: #ececec;
  --text-muted: #888;
  --accent: #7c6fe0;
  --accent-hover: #9589e8;
  --green: #4ade80;
  --yellow: #facc15;
  --red: #f87171;
  --input-bg: #2a2a2a;
  --hover: #252525;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

/* Single phase layout */
.phase-master { display: flex; flex-direction: column; height: 100vh; }

/* Header */
.header {
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.header .logo {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
}
.header h1 { font-size: 18px; font-weight: 600; }

/* Master Selection Screen - Left/Right split */
.master-content {
  flex: 1;
  display: grid;
  grid-template-columns: 220px 1fr;
  overflow: hidden;
}
.master-left {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.master-left-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 600;
}
.master-card-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.wt-card {
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  color: var(--text-muted);
  transition: all 0.12s;
  border: 1px solid transparent;
}
.wt-card:hover { background: var(--hover); color: var(--text); }
.wt-card.selected {
  background: var(--surface);
  border-color: var(--accent);
  color: var(--text);
}
.wt-card .wt-cb {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 11px;
  color: transparent;
  transition: all 0.12s;
}
.wt-card.selected .wt-cb {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.wt-card .wt-name { flex: 1; }
.wt-card .wt-count { font-size: 11px; color: var(--text-muted); }
.cli-shortcuts {
  padding: 4px 8px 8px;
  border-top: 1px solid var(--border);
}
.cli-shortcuts .sidebar-section-title { padding: 6px 8px 4px; }
.cli-btn {
  display: block;
  width: 100%;
  padding: 7px 12px;
  margin-bottom: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: all 0.12s;
}
.cli-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
.cli-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.folder-browse-btn {
  padding: 4px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  margin-top: 4px;
}
.folder-browse-btn:hover { border-color: var(--accent); color: var(--text); }
.cli-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.cli-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.master-left-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
}
.master-left-footer .summary-count { font-size: 20px; font-weight: 700; color: var(--accent); }
.master-left-footer .summary-label { font-size: 11px; color: var(--text-muted); }

/* Folder input inline (replaces proceed button) */
.folder-input-inline {
  display: none;
  margin-top: 8px;
}
.folder-input-inline.active {
  display: block;
}
.folder-input-inline input {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 9px 12px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Cascadia Code', 'Consolas', monospace;
  outline: none;
  margin-bottom: 6px;
}
.folder-input-inline input::placeholder { color: var(--text-muted); }
.folder-input-inline .hint {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.4;
}
.proceed-btn {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.proceed-btn:hover { background: var(--accent-hover); }
.proceed-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.master-right {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.master-right-upper {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.master-right-lower {
  height: 45%;
  min-height: 300px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.terminal-pane {
  flex: 1;
  overflow: hidden;
  background: #0f0f0f;
}
.terminal-pane iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
.master-right-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
}
.master-right-header .spacer { flex: 1; }
.master-right-header button {
  padding: 4px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
}
.master-right-header button:hover { border-color: var(--accent); color: var(--text); }
.add-row-btn {
  padding: 4px 10px;
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 5px;
  color: #fff;
  font-size: 11px;
  cursor: pointer;
  font-weight: 600;
}
.add-row-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.master-right-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 14px;
}
.master-tree-scroll {
  flex: 1;
  overflow-y: auto;
}

/* Tree List */
.master-tree-container {
  /* no border/radius, fits in right panel */
}
.tree-node {
  display: flex;
  align-items: center;
  height: 36px;
  padding-right: 12px;
  cursor: pointer;
  user-select: none;
  font-size: 15px;
  transition: background 0.1s;
}
.tree-node:hover { background: var(--hover); }
.tree-node .tree-toggle {
  width: 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: 16px;
  flex-shrink: 0;
}
.tree-node .tree-label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-node .tree-count {
  font-size: 13px;
  color: var(--text-muted);
  margin-left: 8px;
  flex-shrink: 0;
}
.tree-node .tree-sp-icon {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--yellow);
  margin-left: 6px;
  flex-shrink: 0;
}
.tree-node[data-depth="0"] { font-weight: 600; }
.tree-node[data-depth="0"] .tree-label { color: var(--text); }
.tree-children { display: none; }
.tree-children.open { display: block; }
.inline-edit {
  display: flex;
  gap: 4px;
  align-items: center;
  flex: 1;
}
.ie-field {
  background: var(--input-bg);
  border: 1px solid var(--accent);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  padding: 2px 6px;
  height: 22px;
  outline: none;
  flex: 1;
  min-width: 0;
}
.ie-field.ie-sm { flex: 0.6; }
.ie-save, .ie-cancel {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-muted);
  font-size: 11px;
  padding: 2px 8px;
  cursor: pointer;
  height: 22px;
  flex-shrink: 0;
}
.ie-save { border-color: var(--accent); color: var(--accent); }
.ie-save:hover { background: var(--accent); color: #fff; }

.sidebar-section-title {
  padding: 12px 16px 6px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

/* Add Row Form */
.add-row-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.add-row-overlay.active { display: flex; }
.add-row-form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  width: 420px;
  max-width: 90vw;
}
.add-row-form h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 14px;
  color: var(--text);
}
.add-row-form .form-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.add-row-form .form-row label {
  width: 100px;
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  text-align: right;
}
.add-row-form .form-row input,
.add-row-form .form-row select {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.add-row-form .form-row input:focus,
.add-row-form .form-row select:focus { border-color: var(--accent); }
.add-row-form .form-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 14px;
}
.add-row-form .form-actions button {
  padding: 7px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.add-row-form .form-actions .cancel-btn {
  background: var(--surface);
  color: var(--text-muted);
}
.add-row-form .form-actions .cancel-btn:hover { color: var(--text); }
.add-row-form .form-actions .submit-btn {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.add-row-form .form-actions .submit-btn:hover { background: var(--accent-hover); }

</style>
</head>
<body>

<!-- Single Phase: Master Selection + Terminal -->
<div class="phase-master" id="phaseMaster">
  <div class="header">
    <div class="logo">P</div>
    <h1>photo-ai</h1>
  </div>
  <div class="master-content">
    <div class="master-left">
      <div class="master-left-header">工種マスタ</div>
      <div class="master-card-list" id="masterCardList"></div>
      <div class="cli-shortcuts">
        <div class="sidebar-section-title">Agent</div>
        <button class="cli-btn" data-cmd="claude" disabled>Claude</button>
        <button class="cli-btn" data-cmd="gemini" disabled>Gemini</button>
        <div class="sidebar-section-title" style="margin-top:8px;">写真フォルダ</div>
        <div class="folder-input-inline active" id="folderInputInline">
          <div style="display:flex;gap:4px;align-items:center;">
            <input type="text" id="folderPathInput" placeholder="D:\photos\0211" style="flex:1">
            <button class="folder-browse-btn" id="folderBrowseBtn">参照...</button>
          </div>
        </div>
        <div class="sidebar-section-title" style="margin-top:8px;">実行</div>
        <button class="cli-btn primary" id="analyzeBtn" disabled>Analyze</button>
        <button class="cli-btn" id="exportPdfBtn" disabled>Export PDF</button>
        <button class="cli-btn" id="exportExcelBtn" disabled>Export Excel</button>
      </div>
      <div class="master-left-footer">
        <div><span class="summary-count" id="summaryCount">0</span> <span class="summary-label">行選択中</span></div>
        <div id="summaryDetail" style="font-size:11px;color:var(--text-muted);margin-top:2px;">工種を選択してください</div>
      </div>
    </div>
    <div class="master-right">
      <div class="master-right-upper">
        <div class="master-right-header">
          <span id="rightHeaderLabel">工種を左から選択</span>
          <span class="spacer"></span>
          <button class="add-row-btn" id="addRowBtn">+ 行を追加</button>
          <button id="expandAllBtn">全展開</button>
          <button id="collapseAllBtn">全折畳</button>
        </div>
        <div class="master-tree-scroll">
          <div class="master-tree-container" id="masterTreeContainer"></div>
        </div>
        <div class="master-right-empty" id="masterRightEmpty">左の工種をクリックして展開</div>
      </div>
      <div class="master-right-lower">
        <div class="terminal-pane">
          <iframe src="/terminal.html" id="terminalFrame1"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Row Form Overlay -->
<div class="add-row-overlay" id="addRowOverlay">
  <div class="add-row-form">
    <h3>マスタ行を追加</h3>
    <div class="form-row">
      <label>工種</label>
      <select id="formWorkType"></select>
    </div>
    <div class="form-row">
      <label>写真区分</label>
      <input id="formPhotoType" placeholder="施工状況写真">
    </div>
    <div class="form-row">
      <label>種別</label>
      <input id="formVariety" placeholder="舗装打換え工">
    </div>
    <div class="form-row">
      <label>細別</label>
      <input id="formSubphase" placeholder="舗装版破砕">
    </div>
    <div class="form-row">
      <label>備考</label>
      <input id="formRemarks" placeholder="ダンプ積込状況">
    </div>
    <div class="form-row">
      <label>検索パターン</label>
      <input id="formSearchPatterns" placeholder="ダンプ|積込">
    </div>
    <div class="form-actions">
      <button class="cancel-btn" id="formCancelBtn">キャンセル</button>
      <button class="submit-btn" id="formSubmitBtn">追加</button>
    </div>
  </div>
</div>

<script>
let masterData = {};

// --- Internal state ---
let selectedFolder = '';
let terminalReady = false;
let analyzeRun = false;

function updateButtonStates() {
  const hasFolder = selectedFolder.length > 0;
  const hasWorkTypes = selectedWorkTypes.size > 0;
  document.getElementById('analyzeBtn').disabled = !(terminalReady && hasFolder && hasWorkTypes);
  document.getElementById('exportPdfBtn').disabled = !(terminalReady && analyzeRun);
  document.getElementById('exportExcelBtn').disabled = !(terminalReady && analyzeRun);
  document.querySelectorAll('.cli-btn[data-cmd]').forEach(btn => {
    btn.disabled = !terminalReady;
  });
}

// --- Tree data model ---
let allLeaves = [];
let selectedLeafIds = new Set();
let treeRoot = null;

let selectedWorkTypes = new Set();

async function loadMaster() {
  try {
    const res = await fetch('/api/master');
    masterData = await res.json();
    buildTreeModel();
    renderCardList();
  } catch(e) {
    console.error('Failed to load master.json:', e);
  }
}

function renderCardList() {
  const list = document.getElementById('masterCardList');
  list.innerHTML = '';
  for (const node of treeRoot) {
    const card = document.createElement('div');
    card.className = 'wt-card';
    card.innerHTML = `<span class="wt-cb">\u2713</span><span class="wt-name">${node.label}</span><span class="wt-count">${node.leafIds.length}</span>`;
    card.addEventListener('click', () => {
      if (selectedWorkTypes.has(node.label)) {
        selectedWorkTypes.delete(node.label);
        card.classList.remove('selected');
        for (const id of node.leafIds) selectedLeafIds.delete(id);
      } else {
        selectedWorkTypes.add(node.label);
        card.classList.add('selected');
        for (const id of node.leafIds) selectedLeafIds.add(id);
      }
      renderRightPanel();
      refreshAllCheckboxes();
      updateSummary();
    });
    card._node = node;
    list.appendChild(card);
  }
}

function renderRightPanel() {
  const container = document.getElementById('masterTreeContainer');
  const empty = document.getElementById('masterRightEmpty');
  container.innerHTML = '';
  if (selectedWorkTypes.size === 0) {
    empty.style.display = 'flex';
    document.getElementById('rightHeaderLabel').textContent = '工種を左から選択';
    return;
  }
  empty.style.display = 'none';
  document.getElementById('rightHeaderLabel').textContent =
    [...selectedWorkTypes].join(' + ');
  for (const node of treeRoot) {
    if (!selectedWorkTypes.has(node.label)) continue;
    renderNodeExpanded(container, node);
  }
}

function buildTreeModel() {
  allLeaves = [];
  let leafId = 0;
  treeRoot = [];

  for (const [wtName, rows] of Object.entries(masterData)) {
    const wtNode = { label: wtName, children: [], leafIds: [], depth: 0 };

    const byPhotoType = new Map();
    for (const r of rows) {
      const pt = r.photoType || '';
      if (!byPhotoType.has(pt)) byPhotoType.set(pt, []);
      byPhotoType.get(pt).push(r);
    }

    for (const [pt, ptRows] of byPhotoType) {
      const ptNode = { label: pt || '(未分類)', children: [], leafIds: [], depth: 1 };

      const byVariety = new Map();
      for (const r of ptRows) {
        const v = r.variety || '';
        if (!byVariety.has(v)) byVariety.set(v, []);
        byVariety.get(v).push(r);
      }

      for (const [v, vRows] of byVariety) {
        const bySub = new Map();
        for (const r of vRows) {
          const s = r.subphase || '';
          if (!bySub.has(s)) bySub.set(s, []);
          bySub.get(s).push(r);
        }

        const skipVariety = !v;
        const varietyNode = skipVariety ? null : { label: v, children: [], leafIds: [], depth: 2 };
        const parentForSub = skipVariety ? ptNode : varietyNode;

        for (const [s, sRows] of bySub) {
          const skipSub = !s;
          const subNode = skipSub ? null : {
            label: s, children: [], leafIds: [],
            depth: skipVariety ? 2 : 3
          };
          const parentForLeaf = skipSub ? parentForSub : subNode;

          for (const r of sRows) {
            const lid = leafId++;
            const leafLabel = r.remarks || '(備考なし)';
            const leaf = {
              label: leafLabel,
              leafId: lid,
              leafIds: [lid],
              children: [],
              hasPattern: !!(r.searchPatterns),
              depth: parentForLeaf.depth + 1
            };
            allLeaves.push({ id: lid, row: r, workTypeName: wtName });
            parentForLeaf.children.push(leaf);
            parentForLeaf.leafIds.push(lid);
          }

          if (subNode) {
            parentForSub.children.push(subNode);
            parentForSub.leafIds.push(...subNode.leafIds);
          }
        }

        if (varietyNode) {
          ptNode.children.push(varietyNode);
          ptNode.leafIds.push(...varietyNode.leafIds);
        }
      }

      wtNode.children.push(ptNode);
      wtNode.leafIds.push(...ptNode.leafIds);
    }

    treeRoot.push(wtNode);
  }
}

function getCheckState(node) {
  const total = node.leafIds.length;
  if (total === 0) return 'unchecked';
  const checked = node.leafIds.filter(id => selectedLeafIds.has(id)).length;
  if (checked === 0) return 'unchecked';
  if (checked === total) return 'checked';
  return 'indeterminate';
}

function renderNodeExpanded(parent, node) {
  const hasChildren = node.children.length > 0;
  const isLeaf = node.leafId !== undefined;

  const row = document.createElement('div');
  row.className = 'tree-node';
  row.setAttribute('data-depth', node.depth);
  const indent = 8 + node.depth * 20;
  row.style.paddingLeft = indent + 'px';

  const toggle = document.createElement('span');
  toggle.className = 'tree-toggle';
  if (hasChildren) {
    toggle.textContent = '\u25BC';
  }
  row.appendChild(toggle);

  const label = document.createElement('span');
  label.className = 'tree-label';
  label.textContent = node.label;
  row.appendChild(label);

  const count = document.createElement('span');
  count.className = 'tree-count';
  count.textContent = node.leafIds.length;
  row.appendChild(count);

  if (isLeaf && node.hasPattern) {
    const sp = document.createElement('span');
    sp.className = 'tree-sp-icon';
    sp.title = '検索パターンあり';
    row.appendChild(sp);
  }

  parent.appendChild(row);

  let childrenDiv = null;
  if (hasChildren) {
    childrenDiv = document.createElement('div');
    childrenDiv.className = 'tree-children open';
    parent.appendChild(childrenDiv);
    for (const child of node.children) {
      renderNodeExpanded(childrenDiv, child);
    }
  }

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!childrenDiv) return;
    const isOpen = childrenDiv.classList.contains('open');
    childrenDiv.classList.toggle('open');
    toggle.textContent = isOpen ? '\u25B6' : '\u25BC';
  });

  row.addEventListener('click', (e) => {
    if (e.target === toggle) return;
    if (!childrenDiv) return;
    const isOpen = childrenDiv.classList.contains('open');
    childrenDiv.classList.toggle('open');
    toggle.textContent = isOpen ? '\u25B6' : '\u25BC';
  });

  if (isLeaf) {
    row.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      if (row.querySelector('.inline-edit')) return;
      const leaf = allLeaves[node.leafId];
      const r = leaf.row;
      label.style.display = 'none';

      const form = document.createElement('div');
      form.className = 'inline-edit';
      form.innerHTML = `
        <input class="ie-field" data-key="remarks" value="${(r.remarks||'').replace(/"/g,'&quot;')}" placeholder="備考">
        <input class="ie-field ie-sm" data-key="subphase" value="${(r.subphase||'').replace(/"/g,'&quot;')}" placeholder="細別">
        <input class="ie-field ie-sm" data-key="searchPatterns" value="${(r.searchPatterns||'').replace(/"/g,'&quot;')}" placeholder="検索パターン">
        <button class="ie-save">適用</button>
        <button class="ie-cancel">✕</button>
      `;
      row.insertBefore(form, count);

      const cancel = () => { form.remove(); label.style.display = ''; };
      form.querySelector('.ie-cancel').addEventListener('click', (ev) => { ev.stopPropagation(); cancel(); });

      form.querySelector('.ie-save').addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const fields = form.querySelectorAll('.ie-field');
        for (const f of fields) r[f.dataset.key] = f.value;
        const wtRows = masterData[leaf.workTypeName];
        const rowIdx = wtRows.indexOf(r);
        try {
          const resp = await fetch('/api/master/update', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ workTypeName: leaf.workTypeName, rowIndex: rowIdx, row: r })
          });
          if (!resp.ok) throw new Error(await resp.text());
        } catch(err) {
          console.error('マスタ保存エラー:', err.message);
        }
        label.textContent = r.remarks || '(備考なし)';
        cancel();
      });

      form.querySelector('input').focus();
      form.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); form.querySelector('.ie-save').click(); }
        if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
      });
    });
  }
}

function refreshAllCheckboxes() {
  const cards = document.querySelectorAll('.wt-card');
  for (const card of cards) {
    if (!card._node) continue;
    const state = getCheckState(card._node);
    if (state === 'checked') {
      card.classList.add('selected');
      if (!selectedWorkTypes.has(card._node.label)) selectedWorkTypes.add(card._node.label);
    } else if (state === 'unchecked') {
      card.classList.remove('selected');
      selectedWorkTypes.delete(card._node.label);
    }
  }
}

function updateSummary() {
  const total = selectedLeafIds.size;
  document.getElementById('summaryCount').textContent = total;
  if (total === 0) {
    document.getElementById('summaryDetail').textContent = '工種を選択してください';
  } else {
    const wtNames = new Set();
    for (const id of selectedLeafIds) {
      wtNames.add(allLeaves[id].workTypeName);
    }
    document.getElementById('summaryDetail').textContent =
      [...wtNames].join(' + ');
  }
  updateButtonStates();
}

// --- Command generation ---
async function getMasterPath() {
  const names = [...selectedWorkTypes];
  // Always include 共通
  if (!names.includes('共通')) names.push('共通');
  if (names.length === 1) {
    return 'master/by_work_type/' + names[0] + '.csv';
  }
  // Multiple: merge via server
  const r = await fetch('/api/merge-master', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ masterFiles: names })
  });
  const j = await r.json();
  return j.path;
}

async function runAnalyze(folder) {
  const masterPath = await getMasterPath();
  const cmd = `target/release/photo-ai-rust.exe analyze "${folder}" --master "${masterPath}" --output result.json`;
  sendToTerminal(cmd);
  analyzeRun = true;
  updateButtonStates();
}

// --- Master operation helpers ---

function applyMasterOperation(op) {
  const wt = op.workType;
  if (!wt) return null;

  if (op.action === 'add') {
    if (!masterData[wt]) masterData[wt] = [];
    const newRow = {
      division: '',
      photoType: op.photoType || '',
      workType: wt,
      variety: op.variety || '',
      subphase: op.subphase || '',
      remarks: op.remarks || '',
      searchPatterns: op.searchPatterns || ''
    };
    masterData[wt].push(newRow);
    const path = [wt, op.photoType, op.variety, op.subphase, op.remarks].filter(Boolean).join(' > ');
    return `追加しました: ${path}`;
  }

  if (op.action === 'delete') {
    if (!masterData[wt]) return `工種 "${wt}" が見つかりません`;
    const before = masterData[wt].length;
    masterData[wt] = masterData[wt].filter(r => r.remarks !== op.remarks);
    const after = masterData[wt].length;
    if (before === after) return `削除対象が見つかりません: ${wt} > ${op.remarks}`;
    return `削除しました: ${wt} > ${op.remarks} (${before - after}行)`;
  }

  if (op.action === 'edit') {
    if (!masterData[wt]) return `工種 "${wt}" が見つかりません`;
    let edited = 0;
    for (const r of masterData[wt]) {
      if (r.remarks === op.target) {
        if (op.newRemarks !== undefined) r.remarks = op.newRemarks;
        if (op.newPhotoType !== undefined) r.photoType = op.newPhotoType;
        if (op.newVariety !== undefined) r.variety = op.newVariety;
        if (op.newSubphase !== undefined) r.subphase = op.newSubphase;
        if (op.newSearchPatterns !== undefined) r.searchPatterns = op.newSearchPatterns;
        edited++;
      }
    }
    if (edited === 0) return `編集対象が見つかりません: ${wt} > ${op.target}`;
    return `編集しました: ${wt} > ${op.target} → ${op.newRemarks || op.target} (${edited}行)`;
  }

  return `不明なアクション: ${op.action}`;
}

function refreshTreeAfterMasterChange() {
  buildTreeModel();
  renderCardList();
  const cards = document.querySelectorAll('.wt-card');
  for (const card of cards) {
    if (card._node && selectedWorkTypes.has(card._node.label)) {
      card.classList.add('selected');
      for (const id of card._node.leafIds) selectedLeafIds.add(id);
    }
  }
  renderRightPanel();
  refreshAllCheckboxes();
  updateSummary();
}

function handleMasterOps(ops) {
  const results = [];
  for (const op of ops) {
    const msg = applyMasterOperation(op);
    if (msg) results.push(msg);
  }
  if (results.length > 0) {
    refreshTreeAfterMasterChange();
    console.log('Master ops:', results.join('; '));
  }
  return results.length;
}
