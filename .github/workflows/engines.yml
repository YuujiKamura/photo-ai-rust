name: Build Engines

permissions:
  contents: write

on:
  push:
    tags:
      - "e-*"
    paths:
      - "src/bin/*_engine.rs"
      - "common/**"
      - "photo-engine/**"
      - "deps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/engines.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build-engines:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - package: photo-ai-rust
            bin: photo-pdf-engine
            features: "pdf-gen"
          - package: photo-ai-rust
            bin: photo-tag-engine
          - package: photo-ai-rust
            bin: photo-excel-engine
          - package: photo-engine
            bin: photo-analysis-engine

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout required submodules
        shell: bash
        run: |
          git submodule update --init deps/pdf-analysis-embed

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Build engine
        shell: bash
        run: |
          FEATURES=""
          if [ -n "${{ matrix.features }}" ]; then
            FEATURES="--features ${{ matrix.features }}"
          fi
          cargo build --release -p ${{ matrix.package }} --bin ${{ matrix.bin }} $FEATURES

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}-windows-x86_64
          path: target/release/${{ matrix.bin }}.exe

  release-engines:
    needs: build-engines
    if: startsWith(github.ref, 'refs/tags/e-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engines-latest
          files: |
            photo-pdf-engine-windows-x86_64/photo-pdf-engine.exe
            photo-tag-engine-windows-x86_64/photo-tag-engine.exe
            photo-excel-engine-windows-x86_64/photo-excel-engine.exe
            photo-analysis-engine-windows-x86_64/photo-analysis-engine.exe
          name: Pre-built Engines
          body: |
            These are pre-built engine binaries to speed up main CI.
            Uploaded at: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
