name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "common/**"
      - "photo-engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download Pre-built Engines
        shell: bash
        run: |
          mkdir -p target/release
          # Download from engines-latest release
          URL="https://github.com/YuujiKamura/photo-ai-rust/releases/download/engines-latest"
          for bin in photo-pdf-engine photo-tag-engine photo-excel-engine; do
            echo "Fetching $bin..."
            curl -L -O "$URL/$bin.exe"
            mv "$bin.exe" target/release/
          done

      - name: Build main binary
        run: cargo build --release --bin photo-ai-rust

      - name: Build analysis engine
        run: cargo build --release -p photo-engine --bin photo-analysis-engine

      - name: Run tests
        run: cargo test --release --bin photo-ai-rust

      - name: Run analysis engine tests
        run: cargo test --release -p photo-engine
