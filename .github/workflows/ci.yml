name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "common/**"
      - "photo-engine/**"
      - "photo-ai-go/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout required submodules
        shell: bash
        run: |
          git submodule update --init deps/pdf-analysis-embed

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Cache crate downloads separately from compilation (small, fast, safe to cancel)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # Cache the final binary; skip build+test entirely when source is unchanged
      - name: Cache main binary
        id: binary-cache
        uses: actions/cache@v4
        with:
          path: target/release/photo-ai-rust.exe
          key: binary-${{ runner.os }}-${{ hashFiles('src/**', 'common/**', 'Cargo.lock') }}

      - name: Download Pre-built Engines
        shell: bash
        run: |
          mkdir -p target/release
          # All engines are built/tested via engines.yml; CI just downloads them
          URL="https://github.com/YuujiKamura/photo-ai-rust/releases/download/engines-latest"
          for bin in photo-pdf-engine photo-tag-engine photo-excel-engine photo-analysis-engine; do
            echo "Fetching $bin..."
            curl -L -O "$URL/$bin.exe"
            mv "$bin.exe" target/release/
          done

      - name: Build and test main binary
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: cargo test --release --bin photo-ai-rust

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: photo-ai-go/go.sum

      - name: Copy web assets for Go embed
        shell: bash
        run: |
          mkdir -p photo-ai-go/internal/web
          cp -r web/* photo-ai-go/internal/web/ 2>/dev/null || true

      - name: Build Go CLI
        shell: bash
        run: |
          cd photo-ai-go
          go build -o ../photo-ai.exe ./cmd/photo-ai

      - name: Test Go CLI
        shell: bash
        run: |
          cd photo-ai-go
          go test ./...
