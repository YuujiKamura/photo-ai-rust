name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "common/**"
      - "photo-engine/**"
      - "photo-ai-go/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout required submodules
        shell: bash
        run: |
          git submodule update --init deps/pdf-analysis-embed

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Cache crate downloads separately from compilation (small, fast, safe to cancel)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Build Rust engines from current commit
        shell: bash
        run: |
          # photo-tag-engine is now pure Go (pkg/tagger) — no Rust build needed
          # photo-ai-rust CLI binary removed in #165 Stream A — Go is main CLI.
          cargo build --release -p photo-engine --bin photo-analysis-engine
          cargo build --release -p photo-ai-rust --bin photo-pdf-engine --features pdf-gen
          cargo build --release -p photo-ai-rust --bin photo-excel-engine --features excel

      - name: Run Rust library tests
        run: cargo test --release -p photo-ai-common

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: photo-ai-go/go.sum

      - name: Copy engine binaries for Go embed
        shell: bash
        run: |
          mkdir -p photo-ai-go/internal/engines
          cp target/release/photo-*-engine.exe photo-ai-go/internal/engines/

      - name: Copy web assets and master CSVs for Go embed
        shell: bash
        run: |
          mkdir -p photo-ai-go/internal/web
          cp web/*.html web/*.json photo-ai-go/internal/web/ 2>/dev/null || true
          mkdir -p photo-ai-go/internal/master/by_work_type
          cp master/by_work_type/*.csv photo-ai-go/internal/master/by_work_type/ 2>/dev/null || true
          # ghostty-web dist (placeholder if not available)
          mkdir -p photo-ai-go/internal/web/ghostty/dist
          if [ -d web/ghostty-web/dist ]; then
            cp -r web/ghostty-web/dist/* photo-ai-go/internal/web/ghostty/dist/
          else
            touch photo-ai-go/internal/web/ghostty/dist/.keep
          fi

      - name: Build Go CLI
        shell: bash
        run: |
          cd photo-ai-go
          go build -o ../photo-ai.exe ./cmd/photo-ai

      - name: Test Go CLI
        shell: bash
        run: |
          cd photo-ai-go
          go test ./...
