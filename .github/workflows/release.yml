name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout sibling repos
        shell: bash
        run: |
          for repo in pdf-analysis-embed ai-code-review photo-tagger cli-ai-analyzer folder-watcher; do
            git clone --depth 1 https://github.com/YuujiKamura/$repo.git ../$repo
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release
        run: cargo build --release

      - name: Rename artifact
        shell: bash
        run: cp target/release/photo-ai-rust.exe target/release/photo-ai-rust-windows-x86_64.exe

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: web/go.sum

      - name: Build Go webserver
        shell: bash
        run: |
          cd web
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o webserver-windows-x86_64.exe .

      - name: Build deckpilot
        shell: bash
        run: |
          cd web/deckpilot
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o deckpilot-windows-x86_64.exe .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create all-in-one distribution
        shell: bash
        run: |
          # Install ghostty-web demo dependencies
          cd web/ghostty-web/demo && npm install && cd ../../..
          # Build single distribution directory
          DIST="photo-ai-rust-${{ github.ref_name }}-windows-x86_64"
          mkdir -p "$DIST/web/ghostty-web"
          # Executables
          cp target/release/photo-ai-rust.exe "$DIST/"
          cp web/webserver-windows-x86_64.exe "$DIST/web/webserver.exe"
          cp web/deckpilot/deckpilot-windows-x86_64.exe "$DIST/web/deckpilot.exe"
          # Web assets
          cp web/*.html "$DIST/web/"
          cp -r web/ghostty-web/demo "$DIST/web/ghostty-web/demo"
          cp -r web/ghostty-web/dist "$DIST/web/ghostty-web/dist" 2>/dev/null || true
          cp web/ghostty-web/ghostty-vt.wasm "$DIST/web/ghostty-web/" 2>/dev/null || true
          # Zip
          7z a -tzip "$DIST.zip" "./$DIST/*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} "photo-ai-rust-${{ github.ref_name }}-windows-x86_64.zip" --title "${{ github.ref_name }}" --generate-notes
