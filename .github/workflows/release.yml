name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout sibling repos
        shell: bash
        run: |
          for repo in pdf-analysis-embed ai-code-review photo-tagger cli-ai-analyzer folder-watcher; do
            git clone --depth 1 https://github.com/YuujiKamura/$repo.git ../$repo
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release
        run: cargo build --release

      - name: Rename artifact
        shell: bash
        run: cp target/release/photo-ai-rust.exe target/release/photo-ai-rust-windows-x86_64.exe

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: web/go.sum

      - name: Build Go webserver
        shell: bash
        run: |
          cd web
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o webserver-windows-x86_64.exe .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} target/release/photo-ai-rust-windows-x86_64.exe web/webserver-windows-x86_64.exe --title "${{ github.ref_name }}" --generate-notes
