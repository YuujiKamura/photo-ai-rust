name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build release
        run: cargo build --release

      - name: Build analysis engine
        run: cargo build --release -p photo-engine --bin photo-analysis-engine

      - name: Rename artifact
        shell: bash
        run: cp target/release/photo-ai-rust.exe target/release/photo-ai-rust-windows-x86_64.exe

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: web/go.sum

      - name: Build Go webserver
        shell: bash
        run: |
          cd web
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o webserver-windows-x86_64.exe .

      - name: Build deckpilot
        shell: bash
        run: |
          cd web/deckpilot
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o deckpilot-windows-x86_64.exe .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create all-in-one distribution
        shell: bash
        run: |
          # Install ghostty-web demo dependencies
          cd web/ghostty-web/demo && npm install && cd ../../..
          # Build single distribution directory
          DIST="photo-ai-rust-${{ github.ref_name }}-windows-x86_64"
          mkdir -p "$DIST/web/ghostty-web"
          # Executables
          cp target/release/photo-ai-rust.exe "$DIST/"
          cp target/release/photo-analysis-engine.exe "$DIST/"
          cp web/webserver-windows-x86_64.exe "$DIST/web/webserver.exe"
          cp web/deckpilot/deckpilot-windows-x86_64.exe "$DIST/web/deckpilot.exe"
          # Bundle node.exe from CI runner (same version as setup-node)
          NODE_EXE="$(which node)"
          cp "$NODE_EXE" "$DIST/web/node.exe"
          echo "Bundled Node.js $(node --version)"
          # Web assets
          cp web/*.html "$DIST/web/"
          cp -r web/ghostty-web/demo "$DIST/web/ghostty-web/demo"
          cp -r web/ghostty-web/dist "$DIST/web/ghostty-web/dist" 2>/dev/null || true
          cp web/ghostty-web/ghostty-vt.wasm "$DIST/web/ghostty-web/" 2>/dev/null || true
          # Zip
          7z a -tzip "$DIST.zip" "./$DIST/*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## 使い方

          1. zipを展開
          2. `web\webserver.exe` を実行
          3. ブラウザで http://localhost:9998 を開く

          Node.js同梱済み。追加インストール不要。

          ### CLI単体で使う場合
          ```
          photo-ai-rust.exe analyze <写真フォルダ>
          ```
          NOTES
          gh release create ${{ github.ref_name }} "photo-ai-rust-${{ github.ref_name }}-windows-x86_64.zip" --title "${{ github.ref_name }}" --notes-file release-notes.md
