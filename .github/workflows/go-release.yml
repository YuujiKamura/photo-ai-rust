name: Go Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-rust-engines:
    uses: ./.github/workflows/engines.yml
    secrets: inherit

  build-go-cli:
    needs: build-rust-engines
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: photo-ai-go/go.sum

      - name: Download Rust Engines
        uses: actions/download-artifact@v4
        with:
          path: engines

      - name: Embed engines into Go binary
        shell: bash
        run: |
          mkdir -p photo-ai-go/internal/engines
          # engines/<bin>-windows-x86_64/<bin>.exe -> internal/engines/<bin>.exe
          find engines -name "*.exe" -exec cp {} photo-ai-go/internal/engines/ \;
          echo "Embedded engines:"
          ls -la photo-ai-go/internal/engines/

      - name: Build Go CLI (single binary with embedded engines)
        shell: bash
        run: |
          cd photo-ai-go
          GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo unknown)
          go build -ldflags "-X main.gitCommit=$GIT_COMMIT" -o ../photo-ai.exe ./cmd/photo-ai

      - name: Verify embedded engines
        shell: bash
        run: |
          echo "Binary size:"
          ls -lh photo-ai.exe
          echo "Expected: >50MB (engines embedded)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: photo-ai.exe
          name: Release ${{ github.ref_name }}
          body: |
            photo-ai ${{ github.ref_name }} — single binary with all engines embedded.

            Download `photo-ai.exe` and run. No additional files needed.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
