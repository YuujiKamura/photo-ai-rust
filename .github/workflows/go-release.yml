name: Go Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-go-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: photo-ai-go/go.sum

      - name: Download pre-built Rust engines
        shell: bash
        run: |
          mkdir -p photo-ai-go/internal/engines
          URL="https://github.com/YuujiKamura/photo-ai-rust/releases/download/engines-latest"
          for bin in photo-tag-engine photo-analysis-engine photo-pdf-engine photo-excel-engine; do
            echo "Fetching $bin..."
            curl -L -o "photo-ai-go/internal/engines/$bin.exe" "$URL/$bin.exe"
          done
          echo "Downloaded engines:"
          ls -la photo-ai-go/internal/engines/

      - name: Copy web assets for embedding
        shell: bash
        run: |
          cp -r web/* photo-ai-go/internal/web/ 2>/dev/null || true
          echo "Web assets:"
          ls photo-ai-go/internal/web/

      - name: Build Go CLI (single binary with embedded engines)
        shell: bash
        run: |
          cd photo-ai-go
          GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo unknown)
          go build -ldflags "-X main.gitCommit=$GIT_COMMIT" -o ../photo-ai.exe ./cmd/photo-ai

      - name: Verify binary size
        shell: bash
        run: |
          echo "Binary size:"
          ls -lh photo-ai.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: photo-ai.exe
          name: Release ${{ github.ref_name }}
          body: |
            photo-ai ${{ github.ref_name }} — single binary with all engines embedded.

            Download `photo-ai.exe` and run. No additional files needed.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
