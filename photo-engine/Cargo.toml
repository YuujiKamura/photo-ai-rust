[package]
name = "photo-engine"
version = "0.1.0"
edition = "2021"
description = "Photo AI engine — PDF/Excel/image/EXIF via C ABI"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Image processing
image = { version = "0.25", optional = true }
imageproc = { version = "0.25", optional = true }
ab_glyph = { version = "0.2", optional = true }

# PDF generation
printpdf = { version = "0.8", features = ["jpeg"], optional = true }

# PDF parsing
lopdf = "0.34"

# Excel generation
rust_xlsxwriter = { version = "0.79", optional = true }

# Excel reading
calamine = { version = "0.26", optional = true }

# EXIF extraction
kamadak-exif = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "blocking", "rustls-tls"] }
regex = "1"

# Utilities
rayon = "1"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
photo-ai-common = { path = "../common", default-features = false }
photo-ai-rust = { path = "..", default-features = false }
resident-ai = { git = "https://github.com/YuujiKamura/resident-ai.git", branch = "master" }

[features]
default = ["analysis"]
analysis = []
pdf = ["dep:printpdf", "image"]
excel = ["dep:rust_xlsxwriter", "dep:calamine"]
image = ["dep:image", "dep:imageproc", "dep:ab_glyph"]
