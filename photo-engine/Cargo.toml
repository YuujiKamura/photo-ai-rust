[package]
name = "photo-engine"
version = "0.1.0"
edition = "2021"
description = "Photo AI engine — PDF/Excel/image/EXIF via C ABI"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Image processing
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

# PDF generation
printpdf = { version = "0.8", features = ["jpeg"] }

# PDF parsing
lopdf = "0.34"

# Excel generation
rust_xlsxwriter = "0.79"

# Excel reading
calamine = "0.26"

# EXIF extraction
kamadak-exif = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
rayon = "1"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
