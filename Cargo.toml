[workspace]
members = ["common", "desktop-rust", "web-wasm"]
exclude = ["photo-engine"]
resolver = "2"

[package]
name = "photo-ai-rust"
version = "0.2.0"
edition = "2021"
description = "工事写真AI解析・写真台帳生成ツール"
license = "MIT"

[dependencies]
# PDF解析・埋め込みライブラリ
pdf-analysis-embed = { path = "deps/pdf-analysis-embed" }

# AI CLI解析
cli-ai-analyzer = { path = "deps/cli-ai-analyzer" }

# コードレビュー
ai-code-review = { path = "deps/ai-code-review" }

# 共通ライブラリ
photo-ai-common = { path = "common" }

# フォトタガー（使用機械グループ分け）
photo-tagger = { path = "deps/photo-tagger" }
# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# 画像処理
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
kamadak-exif = "0.5"

# ファイル操作
walkdir = "2"

# 非同期（CLI出力待ち用）
tokio = { version = "1", features = ["full", "process"] }

# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PDF生成（0.8でフォントサブセット化対応）
printpdf = { version = "0.8", features = ["jpeg"] }

# Excel生成
rust_xlsxwriter = "0.79"

# Excel読み込み
calamine = "0.26"

# PDF解析（lopdf）
lopdf = "0.34"

# ログ
log = "0.4"
env_logger = "0.11"

# エラー処理
anyhow = "1"
thiserror = "2"

# ユーティリティ
indicatif = "0.17"
rayon = "1"
dirs = "5"
base64 = "0.22.1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
lazy_static = "1"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
assert_cmd = "2"
predicates = "3"
