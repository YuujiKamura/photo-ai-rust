[workspace]
members = ["common", "photo-engine"]
resolver = "2"

[package]
name = "photo-ai-rust"
version = "0.3.2"
edition = "2021"
description = "工事写真AI解析・写真台帳生成ツール"
license = "MIT"
build = "build.rs"

[features]
default = ["ffi-stubs"]
ffi-stubs = []
# PDF・画像生成機能（photo-pdf-engine など engine bin のみ有効化）
pdf-gen = ["dep:printpdf", "dep:image", "dep:imageproc", "dep:ab_glyph", "pdf-extract"]
# Excel機能（マスタ読み込み・書き出し）
excel = ["dep:rust_xlsxwriter", "dep:calamine", "photo-ai-common/excel"]
# PDFテキスト抽出機能（重いICU依存を含む）
pdf-extract = ["pdf-analysis-embed/extract"]

[[bin]]
name = "photo-pdf-engine"
path = "src/bin/pdf_engine.rs"

[[bin]]
name = "photo-excel-engine"
path = "src/bin/excel_engine.rs"

[[bin]]
name = "photo-ai-rust"
path = "src/main.rs"

[dependencies]
# PDF解析・埋め込みライブラリ
pdf-analysis-embed = { path = "deps/pdf-analysis-embed", default-features = false }

# 共通ライブラリ
photo-ai-common = { path = "common", default-features = false, features = ["pdf"] }

# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rpassword = "5"

# 画像処理（pdf-gen feature でのみ有効）
image = { version = "0.25", optional = true }
imageproc = { version = "0.25", optional = true }
ab_glyph = { version = "0.2", optional = true }
kamadak-exif = "0.5"

# ファイル操作
walkdir = "2"

# 非同期（#[tokio::main]用）
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"

# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PDF生成（pdf-gen feature でのみ有効、0.8でフォントサブセット化対応）
printpdf = { version = "0.8", features = ["jpeg"], optional = true }

# Excel生成
rust_xlsxwriter = { version = "0.79", optional = true }

# Excel読み込み
calamine = { version = "0.26", optional = true }

# PDF解析（lopdf）
lopdf = "0.34"

# ログ
log = "0.4"
env_logger = "0.11"

# エラー処理
anyhow = "1"
thiserror = "2"

# ユーティリティ
indicatif = "0.17"
dirs = "5"
base64 = "0.22.1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
lazy_static = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
